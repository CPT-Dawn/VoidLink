[package]
name = "voidlink"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "A fast, keyboard-first Bluetooth manager for the Linux terminal"
authors = ["Swastik Patel <ping@cptdawn.dev>"]
repository = "https://github.com/CPT-Dawn/VoidLink"
homepage = "https://github.com/CPT-Dawn/VoidLink"
readme = "README.md"
keywords = ["bluetooth", "tui", "bluez", "terminal", "linux"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["assets/", ".github/", "demo/"]

[features]
# Scripted fake adapter for recordings (VOIDLINK_DEMO=1). Never ship this.
demo = []

[dependencies]
# ── TUI ──────────────────────────────────────────────
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# ── Bluetooth ────────────────────────────────────────
bluer = { version = "0.17", features = ["bluetoothd"] }

# ── Async runtime ────────────────────────────────────
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
tokio-stream = "0.1"
futures = "0.3"

# ── Configuration ────────────────────────────────────
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

unicode-width = "0.2"

# ── Search ───────────────────────────────────────────
regex = { version = "1", default-features = false, features = ["std", "perf"] }

# ── Error handling ───────────────────────────────────
color-eyre = "0.6"

# ── Logging ──────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
